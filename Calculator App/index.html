
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App - Bootstrap Project | TechGuy 360</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="calculator-header">
            <h2>Calculator</h2>
        </header>

        <!-- Display -->
        <section class="calculator-display">
            <div id="expression" aria-live="polite"></div>
            <input
                type="text"
                id="display"
                value="0"
                readonly
                aria-label="Calculator display"
            >
        </section>

        <!-- Buttons -->
        <section class="calculator-buttons">
            <button class="calc-btn clear" data-action="clear">C</button>
            <button class="calc-btn" data-action="sign">±</button>
            <button class="calc-btn" data-action="percent">%</button>
            <button class="calc-btn operator" data-value="/">÷</button>

            <button class="calc-btn" data-value="7">7</button>
            <button class="calc-btn" data-value="8">8</button>
            <button class="calc-btn" data-value="9">9</button>
            <button class="calc-btn operator" data-value="*">×</button>

            <button class="calc-btn" data-value="4">4</button>
            <button class="calc-btn" data-value="5">5</button>
            <button class="calc-btn" data-value="6">6</button>
            <button class="calc-btn operator" data-value="-">−</button>

            <button class="calc-btn" data-value="1">1</button>
            <button class="calc-btn" data-value="2">2</button>
            <button class="calc-btn" data-value="3">3</button>
            <button class="calc-btn operator" data-value="+">+</button>

            <button class="calc-btn zero" data-value="0">0</button>
            <button class="calc-btn" data-value=".">.</button>
            <button class="calc-btn equals" data-action="calculate">=</button>

            <button class="calc-btn delete" data-action="delete">Delete</button>
        </section>
    </main>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
