<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-4">Expense Tracker</h1>

        <!-- Summary Cards -->
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card custom-card balance-card">
                    <div class="card-body">
                        <h5>Total Balance</h5>
                        <h3 id="balance">₹0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card custom-card income-card">
                    <div class="card-body">
                        <h5>Total Income</h5>
                        <h3 id="income">₹0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card custom-card expense-card">
                    <div class="card-body">
                        <h5>Total Expenses</h5>
                        <h3 id="expense">₹0.00</h3>
                    </div>
                </div>
            </div>

        </div>

        <div class="row g-4">

            <!-- Add Transaction Form -->
            <div class="col-md-5">
                <div class="card custom-card">
                    <div class="card-body">

                        <h4 class="mb-3">Add Transaction</h4>

                        <form id="expenseForm">

                            <div class="mb-3">
                                <label class="form-label" for="title">
                                    Transaction Name
                                </label>
                                <input
                                    type="text"
                                    id="title"
                                    class="form-control custom-input"
                                    placeholder="e.g. Groceries"
                                    maxlength="100"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="amount">
                                    Amount (₹)
                                </label>
                                <input
                                    type="number"
                                    id="amount"
                                    class="form-control custom-input"
                                    placeholder="Enter amount"
                                    min="0.01"
                                    max="1000000000000"
                                    step="0.01"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="type">
                                    Transaction Type
                                </label>
                                <select id="type" class="form-select custom-input">
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="category">
                                    Category
                                </label>
                                <select id="category" class="form-select custom-input">
                                    <option>Food</option>
                                    <option>Transport</option>
                                    <option>Shopping</option>
                                    <option>Bills</option>
                                    <option>Health</option>
                                    <option>Education</option>
                                    <option>Salary</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="date">
                                    Date
                                </label>
                                <input
                                    type="date"
                                    id="date"
                                    class="form-control custom-input"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary custom-btn w-100"
                            >
                                + Add Transaction
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- Transaction History -->
            <div class="col-md-7">
                <div class="card custom-card">
                    <div class="card-body">

                        <h4 class="mb-3">Transaction History</h4>

                        <div class="mb-3">
                            <select id="filter" class="form-select custom-input">
                                <option value="all">All Transactions</option>
                                <option value="income">Income Only</option>
                                <option value="expense">Expenses Only</option>
                            </select>
                        </div>

                        <div id="transactionList">
                            <p class="text-muted text-center py-4">
                                No transactions yet.
                            </p>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
